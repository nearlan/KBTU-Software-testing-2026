name: Playwright Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

defaults:
  run:
    working-directory: 'Week 6'

jobs:
  test:
    name: Playwright full suite without sharding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 'Week 6/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps
      - name: Run full suite without sharding
        run: npx playwright test
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: 'Week 6/playwright-report/'
          retention-days: 14
      - name: Upload traces and JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-1
          path: 'Week 6/test-results/'
          retention-days: 14
