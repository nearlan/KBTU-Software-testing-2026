name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

defaults:
  run:
    working-directory: 'Week 6'

jobs:
  test:
    name: Playwright shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 'Week 6/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps
      - name: Run full suite across four shards
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload blob report for merging
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: 'Week 6/blob-report/'
          retention-days: 14
      - name: Upload traces and JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: 'Week 6/test-results/'
          retention-days: 14

  merge-reports:
    name: Merge Playwright reports
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 'Week 6/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Download all shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: 'Week 6/all-blob-reports'
          merge-multiple: true
      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload combined HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: 'Week 6/playwright-report/'
          retention-days: 14
          if-no-files-found: error
